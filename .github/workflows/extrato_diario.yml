name: Extrato Bancário Diário

on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 BRT (UTC-3)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

jobs:
  enviar-extrato:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install anthropic

      - name: Executar extrato bancário
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGGY_API_KEY: ${{ secrets.PLUGGY_API_KEY }}
          BANCO_MCP_URL: ${{ secrets.BANCO_MCP_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/extrato_bancario.py
